spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cellcover}?sslmode=disable
    username: ${DB_USER:cellcover}
    password: ${DB_PASSWORD:cellcover}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.spatial.dialect.postgis.PostgisPG10Dialect
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    org.springframework.web.servlet.DispatcherServlet: DEBUG

geoserver:
  url: ${GEOSERVER_URL:http://localhost:8081/geoserver}
  overlap-groups: 8

cellcover:
  raster-dir: ${RASTER_DIR:/Users/lenam/Data/cell-data-rest}
  cog-dir: ${COG_DIR:/Users/lenam/tools/geoserver/data_dir/data/cellcover}
  local-cont-dir: ${LOCAL_CONT_DIR:/Users/lenam/tools/geoserver/data_dir/data/cellcover/continuous}
  parallel-threads: ${IMPORT_THREADS:4}
  geoserver:
    url: ${GEOSERVER_URL:http://localhost:8081/geoserver}
    username: ${GEOSERVER_USER:admin}
    password: ${GEOSERVER_PASSWORD:geoserver}
    workspace: cellcover
    overlap-groups: 8
