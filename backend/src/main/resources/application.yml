spring:
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cellcover}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:cellcover}
    password: ${DB_PASSWORD:cellcover}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        jdbc:
          batch_size: 200
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8

server:
  port: ${SERVER_PORT:8080}

logging:
  file:
    name: /tmp/cellcover-backend.log
  level:
    org.springframework.web.servlet.DispatcherServlet: DEBUG
    com.example.cellcover: DEBUG

geoserver:
  url: ${GEOSERVER_URL:http://localhost:8081/geoserver}
  overlap-groups: 8

cellcover:
  raster-dir: ${RASTER_DIR:/Users/lenam/Data/cell-data-rest}
  cog-dir: ${COG_DIR:/Users/lenam/tools/geoserver/data_dir/data/cellcover}
  local-cont-dir: ${LOCAL_CONT_DIR:/Users/lenam/tools/geoserver/data_dir/data/cellcover/continuous}
  parallel-threads: ${IMPORT_THREADS:4}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:cellcover}
  geoserver:
    url: ${GEOSERVER_URL:http://localhost:8081/geoserver}
    username: ${GEOSERVER_USER:admin}
    password: ${GEOSERVER_PASSWORD:geoserver}
    workspace: cellcover
    overlap-groups: 8

clickhouse:
  url: ${CLICKHOUSE_URL:jdbc:ch://localhost:8123/cellcover?compress=0}
  http-url: ${CLICKHOUSE_HTTP_URL:http://localhost:8123}
  username: ${CLICKHOUSE_USER:default}
  password: ${CLICKHOUSE_PASSWORD:}

nims:
  api:
    base-url: ${NIMS_API_BASE_URL:http://nims-api/api}
    credential: ${NIMS_API_CREDENTIAL:}
    page-size: 500
    timeout-ms: 30000
    retry-max: 3
  sync:
    cron: "0 0 2 * * *"
    grace-period-days: 7

minio:
  source-raster-bucket: ${MINIO_SOURCE_BUCKET:source-raster}
  cog-raster-bucket: ${MINIO_COG_BUCKET:cog-raster}
